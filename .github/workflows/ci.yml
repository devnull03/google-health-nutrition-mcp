name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      GOOGLE_ACCESS_TOKEN: ci-dummy-token-not-a-real-credential
      HEALTH_API_BASE_URL: http://127.0.0.1:8765
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm test
      - run: docker build -t google-health-nutrition-mcp:ci .
